name: Browser method

on:
  push:
    paths:
      - 'methods/webcrypto/**'
      - '.github/workflows/webcrypto.yml'
  pull_request:
    paths:
      - 'methods/webcrypto/**'
      - '.github/workflows/webcrypto.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify WebCrypto mutual proof tests
        working-directory: methods/webcrypto
        run: npm test

  native:
    name: Native Coqui peer and browser interoperability
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: methods/webcrypto/native
      - name: Check native method
        run: cargo clippy --manifest-path methods/webcrypto/native/Cargo.toml --all-targets -- -D warnings
      - name: Native method tests
        run: cargo test --manifest-path methods/webcrypto/native/Cargo.toml
      - name: Interoperate with browser WebCrypto method
        working-directory: methods/webcrypto
        run: node --test test/rust_interop.test.mjs
