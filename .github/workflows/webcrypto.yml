name: Browser method

on:
  push:
    paths:
      - 'methods/webcrypto/**'
      - '.github/workflows/webcrypto.yml'
  pull_request:
    paths:
      - 'methods/webcrypto/**'
      - '.github/workflows/webcrypto.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify WebCrypto mutual proof tests
        working-directory: methods/webcrypto
        run: npm test
