[package]
name = "coqui-peer"
version = "0.1.0"
description = "Peer identity and trust independent of the authentication method: ids, a trust store with pairing, and a sans-IO handshake trait"
readme = "README.md"
edition = "2024"
rust-version = "1.89"
license = "MPL-2.0"
repository = "https://github.com/Boriken-Dev/coqui-peer"
publish = false
exclude = [".*", "*.local.*"]

[package.metadata.docs.rs]
all-features = true

[features]
default = []
# Serialize and deserialize `PeerId` and `Digest` as their text form.
serde = ["dep:serde"]
# Async helpers that drive a handshake over tokio streams and message transports; the
# `_until` forms use tokio's timer.
tokio = ["dep:tokio"]
# PIN pairing: SPAKE2 with key confirmation (spake2, hkdf, hmac), and `Random::os` (rand_core,
# which spake2 already uses, reading the operating system's generator).
pin = ["dep:spake2", "dep:hkdf", "dep:hmac", "dep:rand_core"]

[dependencies]
data-encoding = { version = "2", default-features = false, features = ["alloc"] }
sha1 = "0.11.0"
sha2 = { version = "0.11.1", default-features = false }
subtle = "2.6"
zeroize = { version = "1", default-features = false, features = ["alloc"] }
serde = { version = "1", default-features = false, features = ["derive", "std"], optional = true }
tokio = { version = "1", default-features = false, features = ["io-util", "time"], optional = true }
spake2 = { version = "0.4", optional = true }
hkdf = { version = "0.13", optional = true }
hmac = { version = "0.13", optional = true }
rand_core = { version = "0.6", default-features = false, features = ["getrandom"], optional = true }

[dev-dependencies]
tempfile = "3"
serde_json = "1"
tokio = { version = "1", default-features = false, features = ["macros", "rt", "io-util", "sync", "time"] }
